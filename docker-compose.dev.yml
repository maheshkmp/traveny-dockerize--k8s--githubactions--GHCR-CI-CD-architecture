services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: traveny
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: traveny_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

  api:
    image: oven/bun:1
    working_dir: /app/apps/api
    volumes:
      - .:/app
    command: bun run dev
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://traveny:devpassword@db:5432/traveny_dev
      BETTER_AUTH_SECRET: dev-secret-change-in-prod
      NODE_ENV: development
    ports:
      - "4000:4000"

  web:
    image: oven/bun:1
    working_dir: /app/apps/web
    volumes:
      - .:/app
    command: bun run dev
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://api:4000
      NODE_ENV: development
    ports:
      - "3000:3000"

volumes:
  postgres_data_dev: