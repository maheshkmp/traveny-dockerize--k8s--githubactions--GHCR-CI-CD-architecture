services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: traveny
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: traveny_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

  api:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    command: bun run --hot apps/api/src/index.ts
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://traveny:devpassword@db:5432/traveny_dev
      BETTER_AUTH_SECRET: dev-secret-change-in-prod
      NODE_ENV: development
    ports:
      - "4000:4000"

  web:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/.next
    command: bun run apps/web/dev
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NODE_ENV: development
    ports:
      - "3000:3000"

volumes:
  postgres_data_dev: